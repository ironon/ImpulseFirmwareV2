# Channel Sounding REFLECTOR overlay (anchor role):
#   ./build.sh anchor -- -DEXTRA_CONF_FILE="anchor.conf;cs_reflector.conf"
#
# Values carried from ../nrf_cs_test/reflector, which is the configuration
# proven working against Board V1 on 2026-08-30. Single antenna path, matching
# the BM20C's one chip antenna.
CONFIG_IMPULSE_CS_REFLECTOR=y

# TWO connections. The anchor is a peripheral to BOTH the phone app and the
# ranging watch, at the same time. With MAX_CONN=1 whichever arrives second is
# simply refused — which in the field looks like "ranging stops whenever the
# app is open", the hardest class of bug to reproduce on a bench.
CONFIG_BT_MAX_CONN=2
CONFIG_BT_BONDABLE=n

# The Ranging Profile recommends an MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_BT_SMP=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# Channel Sounding + the Ranging Service responder.
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=1

# REFLECTOR_ONLY is a deliberate saving, not a default: the anchor never
# initiates, so the initiator half of the controller is dead weight.
CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
