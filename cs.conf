# Channel Sounding overlay:  ./build.sh watch -- -DEXTRA_CONF_FILE="watch.conf;cs.conf"
#
# Values carried over from the NCS ras_initiator sample, which is the
# configuration proven working on this hardware pair. The antenna settings
# match Board V1's single chip antenna on the BM20C.
CONFIG_IMPULSE_CS_BACKEND=y

# TWO connections, not one. The watch must hold the app (peripheral) and an
# anchor (central) AT THE SAME TIME: the app expects live status while a
# commitment is being enforced, and enforcement needs the anchor link. With
# MAX_CONN=1 the second connection simply fails, which would present as
# "ranging stops whenever the app is open" — a bug that only appears in the
# field, with a phone in the room.
#
# Concurrent peripheral+central is exactly what broke the ESP32 build
# (v2 §10.1: ble_hs_timer_exp panic on both IDF 4.4.7 and 5.5.5, still
# unfixed, and the reason the app's calibration flow drops the phone link).
# Zephyr's host is a different stack, but this MUST be verified on hardware
# before the enforcement design is trusted — see HARDWARE_TEST_PLAN.
CONFIG_BT_MAX_CONN=2
CONFIG_BT_BONDABLE=n
CONFIG_BT_SCAN_UUID_CNT=1
# The CS scanner matches the anchor iBeacon in the ADVERTISING packet rather
# than the RAS UUID in the scan response — see scan_init() for why.
CONFIG_BT_SCAN_MANUFACTURER_DATA_CNT=1

# The Ranging Profile recommends an MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Single antenna path — the BM20C has one chip antenna, so there is no
# antenna switch and nothing to multiplex.
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CTLR_SDC_CS_ROLE_INITIATOR_ONLY=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n

CONFIG_BT_CS_DE_512_NFFT=y

# Step mode 2 (PBR) with sub-mode 1 (CS-RTT): PBR gives the fine estimate,
# CS-RTT the speed-of-light-bounded cross-check. Spec v3 §4.3.
CONFIG_SAMPLE_RAS_INITIATOR_STEP_MODE_2_SUB_MODE_1=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
