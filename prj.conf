# Impulse firmware — common configuration.
# Role is selected per-build; see boards/*.conf and README.

# --- Debug transport -------------------------------------------------------
# There is no USB CDC on this board: the USB-C connector carries power and CC
# only, and D-/D+ are deliberately unrouted (spec v3 §1.4). Debug is SEGGER RTT
# over SWD through the TC2030-NL footprint. Do NOT enable a UART console and
# expect to see it.
CONFIG_SERIAL=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
# Set EXPLICITLY. This was being auto-selected, and switching the log mode
# silently dropped it — leaving RTT_CONSOLE up (so the boot banner still
# appeared) while every LOG_INF went nowhere. That failure looks exactly like
# a crashed application.
# Logs are rendered by the SHELL backend on channel 0 (see above), so the
# standalone RTT log backend must be OFF or the two collide on one channel.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_PRINTK=y
CONFIG_LOG=y
# IMMEDIATE, not deferred. A deferred backend drops everything still queued
# when the system panics — which is precisely the moment the log matters. This
# device logs rarely enough that synchronous output costs nothing real, and a
# panic with no message costs an hour.
# DEFERRED, not immediate — and this is a forced choice, not a preference.
# SHELL_BACKEND_RTT "depends on !(SHELL_LOG_BACKEND && LOG_MODE_IMMEDIATE)",
# and J-Link's telnet server only ever exposes RTT CHANNEL 0 (port 19021), so
# the shell cannot be moved to channel 1 to dodge the conflict. Having the
# bring-up shell reachable is worth more than immediate logging.
# If you are chasing a hard fault and need immediate logs, flip these three:
#   CONFIG_LOG_MODE_IMMEDIATE=y / CONFIG_SHELL_LOG_BACKEND=y /
#   # Logs are rendered by the SHELL backend on channel 0 (see above), so the
# standalone RTT log backend must be OFF or the two collide on one channel.
CONFIG_LOG_BACKEND_RTT=n  — and accept that ./shell.sh goes silent.
# [verified 2026-09-10]
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_ASSERT=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- Drivers ---------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_INPUT=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_PWM=y

# --- Bring-up shell (RTT). Not for release — see Kconfig. ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
# SHELL_BACKEND_RTT "depends on !(SHELL_LOG_BACKEND && LOG_MODE_IMMEDIATE)".
# SHELL_LOG_BACKEND defaults to y whenever SHELL is set, so turning on
# LOG_MODE_IMMEDIATE (line 24, added so a workqueue stack overflow was
# readable) SILENTLY DISABLED THE WHOLE BRING-UP SHELL: prj.conf still asked
# for it, the build still succeeded, and the only trace was a Kconfig warning
# in the build log. Every ./shell.sh command simply produced nothing.
# Logs still reach RTT through LOG_BACKEND_RTT, so nothing is lost by
# declining the shell's own log backend. [verified 2026-09-10]
CONFIG_SHELL_LOG_BACKEND=y
# ...and once the backend is enabled, shell_rtt.c BUILD_ASSERTs that the shell
# and the log backend are not on the SAME RTT channel. Logs stay on channel 0
# (which is what rtt.sh reads); the shell moves to channel 1, which is why
# shell.sh talks to port 19022 rather than 19021.
CONFIG_SHELL_BACKEND_RTT_BUFFER=0
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=3
CONFIG_SHELL_PROMPT_RTT="impulse:~$ "
# The RTT down-channel defaults to 16 bytes, which silently TRUNCATES any
# shell command longer than that — it arrives as a mangled fragment rather
# than an error.
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=128
# The up-buffer defaults to 1024 bytes and RTT drops what does not fit rather
# than blocking. Bluetooth init emits a burst far larger than that, so the boot
# log was arriving with a hole in the middle — including the line saying
# whether advertising actually started.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# --- Bluetooth (app-facing peripheral, §5.6) ---
CONFIG_BT_DEVICE_NAME="Impulse Watch"
CONFIG_BT_DEVICE_APPEARANCE=192
# The schedule blob is chunked at 20 bytes by the app, but a larger MTU costs
# nothing here and every other characteristic fits in one packet.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_MAX_CONN=1

# --- Storage ---------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Kernel ----------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_REBOOT=y

# Integrity timers are on a MONOTONIC elapsed basis, never wall-clock, so that
# a clock write cannot accelerate a quarantined loosening (spec v2 §9.2).
CONFIG_POSIX_API=n

# Reset cause at boot (power-on / brownout / watchdog / software / pin). Needed
# to tell a brownout from a crash — the 2026-09-12 anchor resets on battery
# could not be classified without it.
CONFIG_HWINFO=y
