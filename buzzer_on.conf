# Compile the buzzer back IN.
#
# CONFIG_IMPULSE_BUZZER_DISABLED defaults to y so that a build nobody thought
# about cannot make a noise in public. This file is the deliberate opt-out, and
# it is a separate fragment rather than a command-line -D so that which builds
# can make sound is visible in the build command and recorded in the shell
# history, not buried in a CMake cache.
CONFIG_IMPULSE_BUZZER_DISABLED=n
