# WiFi (WM02C / nRF7002) overlay:
#   ./build.sh watch -- -DEXTRA_CONF_FILE="watch.conf;cs.conf;wifi.conf" \
#                       -DEXTRA_DTC_OVERLAY_FILE=wifi.overlay
#
# Purpose is NOT general networking. It is the WATCH_REMOVED datagram (v3 §1.5,
# v2 §5.5.1): the watch telling anchors it has been taken off, over a transport
# that by construction outreaches BLE. Sunrise Lock's known bypass is to leave
# the watch out of BLE range and go back to bed, and WiFi is the only transport
# on this board that can close it.
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
# IPv6 off: WATCH_REMOVED is a UDP datagram to an anchor on the LAN, and the
# anchor IP table (§5.5.1) is v4. Carrying a v6 stack costs RAM for nothing.
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Buffers: kept near the sample's numbers. The traffic is a handful of small
# datagrams, but the supplicant's association exchange needs headroom.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_MAX_CONTEXTS=5

# Stacks. The supplicant and the nRF70 driver are both stack-hungry; these are
# the sample's values and are not worth trimming before it works.
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5400
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=153600
CONFIG_ENTROPY_GENERATOR=y

# The `wifi` shell is how this gets verified on a board with no UART: scan and
# connect from the RTT shell. It also keeps the SSID and password OUT of the
# source tree — they are typed at runtime, never committed.
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_SHELL_GETOPT=y
