# RAM diet for the WM02C. Layer AFTER wifi.conf.
#
# The stock nRF70 configuration is sized for a throughput device. This watch
# sends a handful of tiny UDP datagrams (WATCH_REMOVED, §5.5.1) and never
# streams anything, so almost all of the default buffering is dead weight.
# Measured starting point: CS + WiFi = 520 KB of 511 KB, i.e. it did not fit.

# --- 2.4 GHz ONLY -------------------------------------------------------
# Not just a RAM saving: WATCH_REMOVED has to cross a house, and 2.4 GHz
# propagates through walls far better than 5 GHz. The bench associated on
# 5 GHz ch36 purely because the AP was in the same room.
# NRF70_2_4G_ONLY is a def_bool derived from the nRF7001 part number and
# cannot be assigned. The settable knob is the operating-band choice.
CONFIG_NRF_WIFI_2G_BAND=y

# --- the data-plane heap, which was the single largest item -------------
# 48 RX buffers at up to 1600 B each is ~77 KB on its own.
CONFIG_NRF70_RX_NUM_BUFS=6
CONFIG_NRF70_MAX_TX_AGGREGATION=1
CONFIG_NRF70_MAX_TX_TOKENS=5
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=16000
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=12000

# --- the system heap ----------------------------------------------------
# 150 KB was copied from Nordic's shell sample, which runs nothing else.
CONFIG_HEAP_MEM_POOL_SIZE=40960

# --- net buffers --------------------------------------------------------
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MAX_CONTEXTS=3
